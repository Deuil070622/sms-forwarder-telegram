- pipeline: build-apk-start
  name: Build APK.
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  events:
  - type: WEBHOOK
  actions:
  - action: ./gradlew assembleRelease
    type: BUILD
    commands: |-
      export ANDROID_HOME="/opt/android/sdk"
      export PATH=$PATH:/opt/android/sdk/cmdline-tools:/opt/android/sdk/platform-tools

      if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q sdk.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools" 2>/dev/null || true
          rm sdk.zip
      fi

      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon
    setup_commands: apt-get update && apt-get install -y unzip curl
    cached_dirs:
    - /root/.gradle
    - /opt/android/sdk
    shell: BASH
    docker_image_name: library/eclipse-temurin
    docker_image_tag: 25
  - action: Publish my artifact artifact
    type: PUBLISH_ARTIFACT_VERSION
    local_path: app/build/outputs/apk/debug/app-debug.apk
    input_type: BUILD_ARTIFACTS
    versions:
    - latest
    artifact: my artifact
